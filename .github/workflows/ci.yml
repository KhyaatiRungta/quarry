name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check quarry tests
          ruff format --check quarry tests

      - name: Tests with coverage
        run: pytest --cov=quarry --cov-report=term-missing --cov-fail-under=80

      # Offline benchmark - no API key needed; must reproduce resume stats
      - name: Benchmark
        run: python -m quarry bench --tasks benchmarks/tasks.json --json-out bench_results.json
